<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StreamClips Session Sync</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 20, 32, 0.85);
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --success: #10b981;
      --error: #ef4444;
      --text: #f3f4f6;
      --subtext: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }
    h2 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      backdrop-filter: blur(12px);
      margin-bottom: 14px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
      margin-bottom: 8px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .server-input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 12px;
      margin-top: 6px;
      margin-bottom: 12px;
      outline: none;
    }
    .server-input:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .info-text {
      font-size: 11px;
      color: var(--subtext);
      line-height: 1.4;
      margin-top: 10px;
      text-align: center;
    }
    #result-msg {
      margin-top: 10px;
      font-size: 12px;
      padding: 8px;
      border-radius: 8px;
      display: none;
      word-break: break-word;
    }
    .success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <h2>StreamClips YouTube Sync</h2>
  </div>

  <div class="card">
    <div class="status-badge" id="cookie-status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Detecting YouTube Cookies...</span>
    </div>
    
    <label style="font-size: 11px; color: var(--subtext); font-weight: 500;">MultiChat Server Target:</label>
    <input type="text" id="server-url" class="server-input" value="http://localhost:5000" />

    <label style="font-size: 11px; color: var(--subtext); font-weight: 500; margin-top: 4px; display: block;">Target Database Profile:</label>
    <select id="channel-select" class="server-input" style="cursor: pointer;">
      <option value="">Fetching creator profiles...</option>
    </select>

    <div style="display: flex; gap: 8px; margin-bottom: 10px;">
      <button id="switch-account-btn" type="button" style="background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #c4b5fd; border-radius: 8px; padding: 6px 10px; font-size: 11px; cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;">
        <span>🔀 Switch Channel on YouTube</span>
      </button>
    </div>

    <button id="sync-btn" class="btn" style="margin-bottom: 8px;">
      <span>Sync InnerTube Session</span>
    </button>

    <button id="headless-login-btn" class="btn" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); margin-bottom: 8px;">
      <span>🚀 Launch Headless Login Window</span>
    </button>

    <button id="dom-send-btn" class="btn" style="background: linear-gradient(135deg, #10b981, #059669); margin-bottom: 8px;">
      <span>💬 Post Chat via Open YouTube Tab</span>
    </button>

    <details style="margin-top: 10px; font-size: 11px; color: var(--subtext);">
      <summary style="cursor: pointer; padding: 4px 0; font-weight: 500;">📋 Paste Working Cookie String Manually</summary>
      <textarea id="manual-cookie-input" class="server-input" style="height: 60px; resize: vertical; margin-top: 6px;" placeholder="Paste SAPISID=... cookie here"></textarea>
      <button id="save-manual-cookie-btn" class="btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); padding: 6px;">
        <span>Save Pasted Cookie</span>
      </button>
    </details>

    <div id="result-msg"></div>
  </div>

  <div class="info-text">
    Extracts SAPISID session cookies directly from YouTube to enable 100% reliable live chat sending.
  </div>

  <script src="popup.js"></script>
</body>
</html>
